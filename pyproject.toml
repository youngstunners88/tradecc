[project]
name = "tradecc"
version = "0.1.0"
description = "TradeCC — Solana small-capital momentum trading bot (paper-trading first)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
omit = ["src/tests/*"]
