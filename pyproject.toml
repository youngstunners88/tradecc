[project]
name = "tradecc"
version = "0.1.0"
description = "TradeCC — Solana small-capital momentum trading bot (paper-trading first)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Signing and sending (Stage 6c/6d). Kept out of the base dependencies so a
# paper or backtest install carries no key-handling library at all: the
# smallest supply-chain surface for the code that cannot move money.
live = [
    "solders>=0.21",
]
# Research-only. The MCP server in research/edge_gate_mcp.py exposes the
# viability gate as tools; it is never imported by the bot, so this stays out
# of the base dependencies exactly like `live`.
mcp = [
    "mcp>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # The 6c/6d suite exercises real signing against real transaction bytes.
    # Faking the cryptography would test the fake, and this is the one place
    # where "the seam could not express the error" is unaffordable.
    "solders>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
# Network contract tests are excluded by default: the unit suite must pass
# offline and must never fail because a third party had a bad afternoon.
# They run on their own schedule — see .github/workflows/contract-tests.yml.
addopts = "-q -m 'not network'"
markers = [
    "network: hits a real external API (Jupiter, Helius, GeckoTerminal). Excluded from the default run and from PR CI; run with `-m network`.",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/tests/*"]
